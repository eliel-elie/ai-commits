name: Auto Tag and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v ./...

      - name: Determine next version tag
        id: version
        run: |
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v1.0.0"
          else
            VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            # Skip directly to v1.0.0 for the first Go release if still on 0.x tags
            if [ "$MAJOR" -eq 0 ]; then
              NEXT_TAG="v1.0.0"
            else
              COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s%n%b")

              if echo "$COMMITS" | grep -qE "^[a-z]+(\([^)]+\))?!:|BREAKING CHANGE:"; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
              elif echo "$COMMITS" | grep -qE "^feat(\([^)]+\))?:"; then
                MINOR=$((MINOR + 1))
                PATCH=0
              else
                PATCH=$((PATCH + 1))
              fi

              NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${NEXT_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${LATEST_TAG:-none} -> Next tag: $NEXT_TAG"

      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/eliel-elie/ai-commits/internal/cli.Version=${VERSION}"

          GOOS=linux   GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/aic-linux-amd64 ./cmd/aic
          GOOS=linux   GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/aic-linux-arm64 ./cmd/aic
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/aic-windows-amd64.exe ./cmd/aic
          GOOS=windows GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/aic-windows-arm64.exe ./cmd/aic
          GOOS=darwin  GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/aic-darwin-amd64 ./cmd/aic
          GOOS=darwin  GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/aic-darwin-arm64 ./cmd/aic

      - name: Create Git Tag and Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
